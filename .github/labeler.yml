# Label configuration for PR Labeler
# https://github.com/actions/labeler
documentation:
  - changed-files:
      - any-glob-to-any-file: ['Documentation/**/*', '**/*.md']
tests:
  - changed-files:
      # Two layouts coexist while typo3-ci-workflows#186 runs: the reference
      # one puts the configs at Build/phpunit.xml and Build/FunctionalTests.xml,
      # the older one under Build/phpunit/. Matching both keeps the label
      # correct on either side of an extension's migration; drop the last
      # entry once #186 is finished.
      - any-glob-to-any-file: ['Tests/**/*', 'Build/phpunit.xml', 'Build/FunctionalTests.xml', 'Build/phpunit/**/*']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**/*', 'Build/**/*']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['composer.json', 'composer.lock', 'package.json', 'package-lock.json', 'yarn.lock']
configuration:
  - changed-files:
      - any-glob-to-any-file: ['Configuration/**/*', 'ext_*.php', 'composer.json']
