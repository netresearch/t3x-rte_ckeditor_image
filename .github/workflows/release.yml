name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: 'rte-ckeditor-image'
      package-name: 'netresearch/rte-ckeditor-image'
      extension-key: 'rte_ckeditor_image'
      # Maintenance line: a 12.0.x release never takes "Latest" from main's
      # newer major, whatever order the releases are created in.
      make-latest: false
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
