# Configuration for the shared test runner (netresearch/typo3-ci-workflows).
#
# The e2e_provision_* hooks are the extension-specific half of an e2e run. The
# generic half — MariaDB, a composer-installed TYPO3, PHP-FPM, Apache and the
# checks that each came up — is in the runner's e2e-provision.sh.

PROJECT_LABEL="rte_ckeditor_image"

# The Playwright suite, its package.json and its lockfile live here, not at the
# repository root — the root package.json carries only the commit hooks.
E2E_TEST_DIR="Tests/E2E"

# Packages beyond the extension itself. The variant decides the "extension
# neighborhood" the instance is set up with, so that a regression which only
# appears with fluid_styled_content or the Bootstrap Package is reachable.
# ${E2E_VARIANT} and ${E2E_TYPO3_VERSION} are set by the runner.
e2e_provision_packages() {
    case "${E2E_VARIANT}" in
        core-only)
            echo "typo3/cms-reports"
            ;;
        fsc)
            echo "typo3/cms-fluid-styled-content typo3/cms-reports"
            ;;
        bootstrap)
            # Bootstrap Package majors track TYPO3 majors: ^15 -> v13, ^16 -> v14.
            if [[ "${E2E_TYPO3_VERSION}" == "14" ]]; then
                echo "typo3/cms-fluid-styled-content typo3/cms-reports bk2k/bootstrap-package:^16.0"
            else
                echo "typo3/cms-fluid-styled-content typo3/cms-reports bk2k/bootstrap-package:^15.0"
            fi
            ;;
        *)
            echo "typo3/cms-fluid-styled-content typo3/cms-reports"
            ;;
    esac
}

# Site-set dependencies, matching the packages above — a set only resolves when
# the extension providing it is installed.
e2e_provision_site_dependencies() {
    case "${E2E_VARIANT}" in
        core-only)
            printf '  - netresearch/rte-ckeditor-image\n'
            ;;
        bootstrap)
            # "bootstrap-package/full" exists in both the ^15 and ^16 ranges.
            printf '  - bootstrap-package/full\n  - netresearch/rte-ckeditor-image\n'
            ;;
        *)
            printf '  - typo3/fluid-styled-content\n  - netresearch/rte-ckeditor-image\n'
            ;;
    esac
}

# TypoScript for the root template. Split by variant because core-only does not
# have fluid_styled_content installed, so importing its TypoScript would fail at
# parse time — that variant inlines a minimal styles.content.get instead,
# mirroring what fluid_styled_content normally provides.
e2e_provision_typoscript() {
    if [[ "${E2E_VARIANT}" == "core-only" ]]; then
        cat > "${E2E_SCRIPTS}/ts-constants.typoscript" <<'TSCONST'
# core-only: no fluid_styled_content constants import (extension not installed).
styles.content.image.lazyLoading = lazy
TSCONST
        cat > "${E2E_SCRIPTS}/ts-setup.typoscript" <<'TSSETUP'
styles.content.get = CONTENT
styles.content.get {
    table = tt_content
    select {
        orderBy = sorting
        where = {#colPos}=0
    }
}

@import 'EXT:rte_ckeditor_image/Configuration/TypoScript/ImageRendering/setup.typoscript'
TSSETUP
    else
        cat > "${E2E_SCRIPTS}/ts-constants.typoscript" <<'TSCONST'
@import 'EXT:fluid_styled_content/Configuration/TypoScript/constants.typoscript'

# Image lazy loading setting
styles.content.image.lazyLoading = lazy
TSCONST
        cat > "${E2E_SCRIPTS}/ts-setup.typoscript" <<'TSSETUP'
@import 'EXT:fluid_styled_content/Configuration/TypoScript/setup.typoscript'
@import 'EXT:rte_ckeditor_image/Configuration/TypoScript/ImageRendering/setup.typoscript'
TSSETUP
    fi

    # Shared across variants: page rendering, the popup configuration the
    # ImageRenderingController reads, and the extension's alignment CSS.
    #
    # Deliberately NO `lib.parseFunc_RTE.allowTags := addToList(...)` here.
    # Neither v13.4 nor v14.3 fluid_styled_content sets allowTags on
    # lib.parseFunc_RTE, and with allowTags undefined the "everything allowed"
    # short-circuit in ContentObjectRenderer::parseFuncInternal() applies.
    # addToList on an undefined allowTags produces a RESTRICTIVE whitelist of
    # just the listed tags and encodes everything else, <p> included — the same
    # bug class #790 reported in the extension itself. Adding it back would make
    # the test infrastructure reproduce the bug it exists to prove absent.
    cat >> "${E2E_SCRIPTS}/ts-setup.typoscript" <<'TSBODY'

# Ensure lib.contentElement.settings.media.popup is set for click-to-enlarge.
# This path MUST exist for ImageRenderingController to find popup config.
lib.contentElement.settings.media.popup {
    bodyTag = <body style="margin:0; background:#fff;">
    wrap = <a href="javascript:close();"> | </a>
    width = 800m
    height = 600m
    crop.data = file:current:crop
    JSwindow = 1
    JSwindow.newWindow = 1
    directImageLink = 0
}

page = PAGE
page.typeNum = 0
page.10 < styles.content.get

# Include CSS for image alignment styles (image-left, image-center, image-right)
page.includeCSS.rte_ckeditor_image_alignment = EXT:rte_ckeditor_image/Resources/Public/Css/image-alignment.css
TSBODY
}

# Demo content: pages, an image in fileadmin, and the content elements the
# suite asserts against. Runs after the schema exists. The script lives in
# Tests/E2E/Fixtures/ rather than inline in a shell heredoc, where quoting PHP
# inside a double-quoted `bash -c` used to break it.
e2e_provision_seed() {
    ${CONTAINER_BIN} run ${CONTAINER_COMMON_PARAMS} --name e2e-seed-${SUFFIX} \
        -v "${E2E_ROOT}:/var/www/html" \
        -v "${ROOT_DIR}:/extension:ro" \
        -w /var/www/html \
        ${IMAGE_PHP} php /extension/Tests/E2E/Fixtures/seed-content.php
}
