# Register image plugin for ckeditor
editor:
  config:
    # Descriptor form { module, exports }: rte_ckeditor turns a plain string into
    # exactly this, but other consumers of the preset (e.g. the Visual Editor of
    # FriendsOfTYPO3) read 'module' from every entry and fail on a string.
    importModules:
      - { module: '@netresearch/rte-ckeditor-image/Plugins/typo3image.js', exports: ['default'] }

    contentsCss:
      - 'EXT:rte_ckeditor_image/Resources/Public/Css/editor-image-widget.css'

    # Fix linkProperties error: CKEditor 5 default includes 'linkProperties'
    # but TYPO3's Typo3Link plugin doesn't provide it
    link:
      decorators: []
      # Override default toolbar to remove 'linkProperties'
      toolbar: ['linkPreview', '|', 'editLink', 'unlink']

  externalPlugins:
    typo3image: { route: "rteckeditorimage_wizard_select_image" }

processing:
  allowTagsOutside:
    - img
    - a
    - figure
  allowTags:
    - figure
    - figcaption
  allowAttributes:
    - 'figure[class]'
    - 'a[class]'
    - 'a[data-link-params]'